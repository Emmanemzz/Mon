<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!--Font Lato-->
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/mon.css}" />
    <link rel="stylesheet" th:href="@{/css/error.css}">
    <title>Mon - Error 404</title>
  </head>
  <!--TODO
    Falta agregar estilos-->
  <body>
    <!--HEADER MON-->
    <header class="container-fluid py-2">
      <div class="row align-items-center">
        <!-- Logo Mon-->
        <div class="col-auto">
          <a th:href="@{/}">
            <img
              th:src="@{/images/logo/mon-logo.png}"
              alt="Logo Mon"
              height="70"
            />
          </a>
        </div>

        <!-- Barra de búsqueda de recetas o usuarios-->
        <div class="col">
          <form th:action="@{/recetas}" method="get">
            <input
              type="text"
              name="q"
              class="form-control"
              placeholder="Busca una receta o usuario..."
              th:value="${q}"
            />
          </form>
        </div>

        <!-- Botone -->
        <div class="col-auto">
          <th:block th:if="${#authorization.expression('isAnonymous()')}">
            <!--Button iniciar sesión-->
            <a th:href="@{/login}" class="btn btn-outline-secondary me-2"
              >Iniciar sesión</a
            >
            <!--Butto registro-->
            <a th:href="@{/registro}" class="btn btn-outline-secondary"
              >Registro</a
            >
          </th:block>
          <th:block th:if="${#authorization.expression('isAuthenticated()')}">
            <form th:action="@{/logout}" method="post" class="d-inline">
              <button type="submit" class="btn btn-outline-secondary">
                Cerrar sesión
              </button>
            </form>
          </th:block>
        </div>
      </div>
    </header>
    <!--Fin del header-->

<section class="container my-5 flex-grow-1">
  <div class="row align-items-center">
    <!--Imagen-->
    <div class="col-md-6 text-center">
      <img
        th:src="@{/images/error/error-404.png}"
        alt="404"
        class="img-fluid"
        style="max-width: 350px"
      />
    </div>
    <!--Texto y botón-->
    <div class="col-md-6">
      <h1 class="error-codigo">404</h1>
      <h2 class="error-titulo">Página no encontrada</h2>
      <p class="error-texto">La página que buscas no existe o ha sido eliminada.</p>
      <a th:href="@{/}" class="btn btn-error mt-3">IR AL INICIO</a>
    </div>
  </div>
</section>

    <!--Footer-->
    <footer class="container-fluid py-5 mt-4">
      <div class="container">
        <div class="row align-items-start">
          <!--Links rápidos-->
          <div class="col-md-4 mb-4 mb-md-0">
            <h6 class="footer-titulo">Enlaces</h6>
            <ul class="list-unstyled">
              <li><a th:href="@{/}" class="footer-link">Inicio</a></li>
              <li><a th:href="@{/recetas}" class="footer-link">Recetas</a></li>
              <li>
                <a th:href="@{/contacto}" class="footer-link">Contacto</a>
              </li>
            </ul>
          </div>

          <!--Centro: redes sociales y copyright-->
          <div class="col-md-4 text-center mb-4 mb-md-0">
            <h6 class="footer-titulo">Síguenos</h6>
            <div class="mb-3">
              <a th:href="@{https://www.instagram.com/}" target="_blank">
                <img
                  th:src="@{/images/iconos/rrss/instagram.png}"
                  alt="Instagram"
                  height="28"
                />
              </a>
              <a th:href="@{https://x.com/}" target="_blank">
                <img
                  th:src="@{/images/iconos/rrss/x.png}"
                  alt="X"
                  height="28"
                />
              </a>
              <a th:href="@{https://www.tiktok.com/}" target="_blank">
                <img
                  th:src="@{/images/iconos/rrss/tiktok.png}"
                  alt="TikTok"
                  height="28"
                />
              </a>
              <a th:href="@{https://www.youtube.com/}" target="_blank">
                <img
                  th:src="@{/images/iconos/rrss/youtube.png}"
                  alt="Youtube"
                  height="28"
                />
              </a>
            </div>
            <p class="footer-copyright">© 2025 Mon</p>
          </div>

          <!--Derecha: logo, eslogan y github-->
          <div class="col-md-4 text-end mb-4 mb-md-0">
            <a th:href="@{/}">
              <img
                th:src="@{/images/logo/mon-logo-sinfondo.png}"
                alt="Logo Mon"
                height="60"
                class="mb-2"
              />
            </a>
            <p class="footer-eslogan">Descubre recetas con Mon</p>
            <a
              href="https://github.com/Emmanemzz"
              target="_blank"
              class="footer-github"
            >
              <i class="fa-brands fa-github me-1"></i>GitHub
            </a>
          </div>
        </div>
      </div>
    </footer>
    <!--Fin del footer-->
  </body>
</html>
