<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!--Font Lato-->
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/mon.css}" />
    <link rel="stylesheet" th:href="@{/css/formulario.css}">
    <title>Mon - Formulario Receta</title>
  </head>
  <body>
   <!--HEADER MON-->
    <header class="container-fluid py-2">
      <div class="row align-items-center">
        <div class="col-auto">
          <a th:href="@{/}">
            <img
              th:src="@{/images/logo/mon-logo.png}"
              alt="Logo Mon"
              height="70"
            />
          </a>
        </div>
        <div class="col">
          <form th:action="@{/recetas}" method="get">
            <input
              type="text"
              name="q"
              class="form-control"
              placeholder="Busca una receta o usuario..."
              th:value="${q}"
            />
          </form>
        </div>
        <!-- Botones solo en escritorio -->
        <div class="col-auto d-none d-lg-block">
          <th:block th:if="${#authorization.expression('isAnonymous()')}">
            <a th:href="@{/login}" class="btn btn-outline-secondary me-2"
              >Iniciar sesión</a
            >
            <a th:href="@{/registro}" class="btn btn-outline-secondary"
              >Registro</a
            >
          </th:block>
          <th:block th:if="${#authorization.expression('isAuthenticated()')}">
            <form th:action="@{/logout}" method="post" class="d-inline">
              <button type="submit" class="btn btn-outline-secondary">
                Cerrar sesión
              </button>
            </form>
          </th:block>
        </div>
      </div>
    </header>
    <!--Fin del header-->

    <!--Menú de navegación-->
    <nav class="navbar navbar-expand-lg">
      <div class="container-fluid">
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#menuPrincipal"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a th:href="@{/}" class="nav-link">Inicio</a>
            </li>
            <li class="nav-item">
              <a th:href="@{/recetas}" class="nav-link">Recetas</a>
            </li>
            <li class="nav-item">
              <a th:href="@{/perfil}" class="nav-link">Perfil</a>
            </li>
            <li class="nav-item">
              <a th:href="@{/contacto}" class="nav-link">Contacto</a>
            </li>
          </ul>
          <!-- Botones solo en móvil dentro del menú -->
          <div class="d-lg-none text-center py-2">
            <th:block th:if="${#authorization.expression('isAnonymous()')}">
              <a th:href="@{/login}" class="btn btn-outline-secondary me-2 mb-2"
                >Iniciar sesión</a
              >
              <a th:href="@{/registro}" class="btn btn-outline-secondary mb-2"
                >Registro</a
              >
            </th:block>
            <th:block th:if="${#authorization.expression('isAuthenticated()')}">
              <form th:action="@{/logout}" method="post" class="d-inline">
                <button type="submit" class="btn btn-outline-secondary mb-2">
                  Cerrar sesión
                </button>
              </form>
            </th:block>
          </div>
        </div>
      </div>
    </nav>
    <!--Fin menú de navegación-->

    <!--Contenido del formulario-->
    <div class="container my-4">
      <!--Encabezado del formulario-->
      <h2
        class="text-center formulario-titulo"
        th:text="${receta.id == null} ? 'Crear receta' : 'Editar receta'"
      >
        Crear receta
      </h2>

      <form
        th:action="${receta.id == null} ? @{/recetas/nueva} : @{/recetas/{id}/editar(id=${receta.id})}"
        th:object="${receta}"
        method="post"
      >
        <!--Título receta-->
        <div class=" formulario-seccion mb-4 text-center">
          <input
            type="text"
            th:field="*{titulo}"
            placeholder="Introduzca un título de receta"
            class="form-control text-center"
          />
        </div>

        <!--Descripción receta-->
        <div class=" formulario-seccion mb-4">
          <textarea
            th:field="*{descripcion}"
            rows="2"
            placeholder="Escribe una breve descripción de tu receta..."
            class="form-control"
          ></textarea>
        </div>

      <div class="formulario-seccion">
        <div class="row">
          <!--Ingredientes-->
          <div class="col-md-4">
            <textarea
              th:field="*{ingredientes}"
              rows="5"
              placeholder="Escribe un ingrediente por línea"
              class="form-control"
            >
            </textarea>
          </div>
          <!--Dificultad, tiempo, imágenes-->
          <div class="col-md-8">
            <div class="input-group mb-2">
              <span class="input-group-text">Tiempo de preparación</span>
              <select th:field="*{tiempoPreparacion}" class="form-select">
                <option value="">Selecciona un tiempo</option>
                <option value="Menos de 15 min">Menos de 15 min</option>
                <option value="15-30 min">15-30 min</option>
                <option value="30-60 min">30-60 min</option>
                <option value="Más de 1 hora">Más de 1 hora</option>
              </select>
            </div>

            <div class="input-group mb-3">
              <span class="input-group-text">Dificultad</span>
              <select th:field="*{dificultad}" class="form-select">
                <option value="">Selecciona una dificultad</option>
                <option value="Fácil">Fácil</option>
                <option value="Media">Media</option>
                <option value="Difícil">Difícil</option>
                <option value="Experto">Experto</option>
              </select>
            </div>

            <div class="row">
              <div class="col-md-6">
                <div class="border p-3 text-center">
                  <p class="text-muted mb-1">Imagen 1</p>
                  <input
                    type="text"
                    th:field="*{imagen1}"
                    placeholder="Pega aquí la URL https://..."
                    class="form-control"
                  />
                </div>
              </div>
              <div class="col-md-6">
                <div class="border p-3 text-center">
                  <p class="text-muted mb-1">Imagen 2</p>
                  <input
                    type="text"
                    th:field="*{imagen2}"
                    placeholder="Pega aquí la URL https://..."
                    class="form-control"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>
        </div>

        <!--Preparación-->
        <div class=" formulario-seccion mt-4">
          <div class="border p-3 formulario-metodo">
            <h6>Método de preparación</h6>
            <textarea
              th:field="*{metodoPreparacion}"
              rows="6"
              placeholder="Escribe aquí los pasos de tu deliciosa receta &#128512;"
              class="form-control border-0"
            ></textarea>
          </div>
        </div>

        <!--EXTRA ETIQUETAS-->
        <div class="formulario-seccion row mt-3">
          <!--Tipo de cocina-->
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Tipo de cocina</label>
            <div
              th:each="opcion : ${ {'Mediterránea', 'Oriental', 'Latinoamericana', 'Nórdica'} }"
            >
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  th:name="pais"
                  th:value="${opcion}"
                  th:id="'cocina-' + ${opcion}"
                  th:checked="${receta.pais == opcion}"
                />
                <label
                  class="form-check-label"
                  th:for="'cocina-' + ${opcion}"
                  th:text="${opcion}"
                ></label>
              </div>
            </div>
          </div>

          <!--Tipo de dieta-->
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Tipo de dieta</label>
            <div
              th:each="opcion : ${ {'Vegana', 'Vegetariana', 'Flexitariana'} }"
            >
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  th:name="tipoDieta"
                  th:value="${opcion}"
                  th:id="'dieta-' + ${opcion}"
                  th:checked="${receta.tipoDieta == opcion}"
                />
                <label
                  class="form-check-label"
                  th:for="'dieta-' + ${opcion}"
                  th:text="${opcion}"
                ></label>
              </div>
            </div>
          </div>

          <!--Intolerancias/alergias-->
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Intolerancias/alergias</label>
            <div
              th:each="opcion : ${ {'Sin gluten', 'Lácteos', 'Frutos secos', 'Huevo'} }"
            >
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  th:name="alergias"
                  th:value="${opcion}"
                  th:id="'alergia-' + ${opcion}"
                  th:checked="${receta.alergias != null and receta.alergias.contains(opcion)}"
                />
                <label
                  class="form-check-label"
                  th:for="'alergia-' + ${opcion}"
                  th:text="${opcion}"
                ></label>
              </div>
            </div>
          </div>

          <!--Tipo de plato-->
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Tipo de plato</label>
            <div
              th:each="opcion : ${ {'Entrante', 'Principal', 'Postre', 'Bebida'} }"
            >
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="radio"
                  th:name="tipoPlato"
                  th:value="${opcion}"
                  th:id="'plato-' + ${opcion}"
                  th:checked="${receta.tipoPlato == opcion}"
                />
                <label
                  class="form-check-label"
                  th:for="'plato-' + ${opcion}"
                  th:text="${opcion}"
                ></label>
              </div>
            </div>
          </div>
        </div>
        <!--Fin extra etiquetas-->

        <div class="text-center mt-4">
          <button type="submit" class="btn btn-guardar-form px-5">
            Guardar receta
          </button>
          <a th:href="@{/recetas}" class="btn btn-cancelar px-5"
            >Cancelar</a
          >
        </div>
      </form>
    </div>

    <!--Footer-->
    <footer class="container-fluid py-5 mt-4">
      <div class="container">
        <div class="row align-items-start">
          <!--Links rápidos-->
          <div class="col-md-4 mb-4 mb-md-0">
            <h6 class="footer-titulo">Enlaces</h6>
            <ul class="list-unstyled">
              <li><a th:href="@{/}" class="footer-link">Inicio</a></li>
              <li><a th:href="@{/recetas}" class="footer-link">Recetas</a></li>
              <li>
                <a th:href="@{/contacto}" class="footer-link">Contacto</a>
              </li>
            </ul>
          </div>

          <!--Centro: redes sociales y copyright-->
          <div class="col-md-4 text-center mb-4 mb-md-0">
            <h6 class="footer-titulo">Síguenos</h6>
            <div class="mb-3">
              <a th:href="@{https://www.instagram.com/}" target="_blank">
                <img
                  th:src="@{/images/iconos/rrss/instagram.png}"
                  alt="Instagram"
                  height="28"
                />
              </a>
              <a th:href="@{https://x.com/}" target="_blank">
                <img
                  th:src="@{/images/iconos/rrss/x.png}"
                  alt="X"
                  height="28"
                />
              </a>
              <a th:href="@{https://www.tiktok.com/}" target="_blank">
                <img
                  th:src="@{/images/iconos/rrss/tiktok.png}"
                  alt="TikTok"
                  height="28"
                />
              </a>
              <a th:href="@{https://www.youtube.com/}" target="_blank">
                <img
                  th:src="@{/images/iconos/rrss/youtube.png}"
                  alt="Youtube"
                  height="28"
                />
              </a>
            </div>
            <p class="footer-copyright">© 2025 Mon</p>
          </div>

          <!--Derecha: logo, eslogan y github-->
          <div class="col-md-4 text-end mb-4 mb-md-0">
            <a th:href="@{/}">
              <img
                th:src="@{/images/logo/mon-logo-sinfondo.png}"
                alt="Logo Mon"
                height="60"
                class="mb-2"
              />
            </a>
            <p class="footer-eslogan">Descubre recetas con Mon</p>
            <a
              href="https://github.com/Emmanemzz"
              target="_blank"
              class="footer-github"
            >
              <i class="fa-brands fa-github me-1"></i>GitHub
            </a>
          </div>
        </div>
      </div>
    </footer>
    <!--Fin del footer-->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/confirmaciones.js}"></script>
  </body>
</html>
